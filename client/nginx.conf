# Nginx — єдина точка входу стеку.
# Віддає статику React і проксує /api та /uploads на бекенд (сервіс `server` у docker-мережі).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Обмеження для завантаження фото майстрів (бекенд теж перевіряє, це перший бар'єр).
    client_max_body_size 4m;

    # API бекенда. Слеш у proxy_pass відсутній — шлях /api/... передається як є.
    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Завантажені фото майстрів (віддає бекенд через UseStaticFiles).
    location /uploads/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: усі інші шляхи віддають index.html (клієнтський роутинг react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
